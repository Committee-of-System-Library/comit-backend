name: Validate API Docs

on:
  pull_request:

jobs:
  validate-api-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 이 스텝이 곧 PR 게이트다: @ApiContract가 깨졌거나 컴파일이 실패하면 여기서 PR이 막힌다.
      # 생성물 docs/api는 더 이상 git에 커밋하지 않으므로(ADR-005), 기존 git diff 검증 스텝은 제거했다.
      # (PR에서 도는 워크플로는 이것 하나뿐이고, generateApiDocs는 dependsOn classes라 컴파일 체크도 겸한다.)
      - name: Generate API docs (PR 게이트 — 생성·컴파일 성공만 확인)
        run: ./gradlew generateApiDocs

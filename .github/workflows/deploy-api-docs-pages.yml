name: Deploy API Docs to GitHub Pages

on:
  # 수동 발행만 — 코드 머지(main push)와 분리한다.
  # 문서 사이트를 갱신하려면 Actions 탭에서 직접 실행하거나 `gh workflow run deploy-api-docs-pages.yml`.
  # 발행 시점의 main 기준으로 generateApiDocs가 매번 새로 문서를 생성해 올린다.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-api-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Generate API docs
        run: ./gradlew generateApiDocs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy-api-docs:
    runs-on: ubuntu-latest
    needs: build-api-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

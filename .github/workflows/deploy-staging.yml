name: CI/CD (Staging)

concurrency:
  group: deploy-staging-${{ github.repository }}
  cancel-in-progress: false

on:
  push:
    branches: [ "staging" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}
  IMAGE_NAME: ${{ github.event.repository.name }}
  STAGING_IMAGE_NAME: comit-test
  CONT_NAME: comit-loadtest

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Run tests
        run: ./gradlew generateApiDocs test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - name: Set organization name to lowercase
        run: |
          echo "ORG_LC=${ORG,,}" >> $GITHUB_ENV

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Get current date
        id: getDate
        run: echo "date=$(date +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Cache Gradle files
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Grant execute permission to gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle (+ API 문서 생성)
        run: ./gradlew clean build generateApiDocs -x test

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login $REGISTRY -u ${{ github.actor }} --password-stdin

      - name: Build and push staging image
        run: |
          docker build \
            -t $REGISTRY/$ORG_LC/$STAGING_IMAGE_NAME:latest \
            -t $REGISTRY/$ORG_LC/$STAGING_IMAGE_NAME:${{ steps.getDate.outputs.date }} \
            .
          docker push $REGISTRY/$ORG_LC/$STAGING_IMAGE_NAME --all-tags
